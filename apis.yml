aid: zenadmin
name: ZenAdmin
description: >-
  ZenAdmin is an all-in-one IT management platform for global teams, covering the
  full device and employee lifecycle: IT procurement, device lifecycle management,
  asset and inventory tracking, mobile device management (MDM), identity and access
  management, SaaS/app management, IT helpdesk, and 24/7 IT support across 150+
  countries. ZenAdmin publishes an External API v1 (documented at docs.zenadmin.ai)
  for programmatic access to devices, hardware orders, a hardware catalog, employees,
  and outbound webhooks. Authentication is a per-key API key sent via the x-api-key
  header. This profile was originally surfaced as a 500 Global portfolio company and
  has been enriched from the live developer documentation.
